services:
  mlflow:
    image: mibici-risk-api:compose
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --serve-artifacts
      - --artifacts-destination
      - /mlflow/artifacts
      - --allowed-hosts
      - "localhost:*,127.0.0.1:*,mlflow:5000"
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5001}:5000"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    image: mibici-risk-api:compose
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_URI: ${MODEL_URI:-models:/mibici-equipo30-p2-riesgo@champion}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    restart: on-failure

volumes:
  mlflow_data:
